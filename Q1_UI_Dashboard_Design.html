<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
  .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .header { text-align: center; margin-bottom: 30px; }
  .image-grid { display: flex; gap: 20px; justify-content: space-between; margin-bottom: 30px; }
  .image-card { flex: 1; text-align: center; border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
  .image-placeholder { width: 100%; height: 250px; background: #eee; display: flex; align-items: center; justify-content: center; color: #888; font-weight: bold; margin-bottom: 15px; }
  .rating-group { margin-bottom: 15px; text-align: left; }
  .rating-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
  .stars { display: flex; gap: 5px; }
  .star { width: 20px; height: 20px; background: #ccc; border-radius: 50%; display: inline-block; cursor: pointer; }
  .star:hover { background: #ffd700; }
  .btn { display: block; width: 100%; padding: 10px; background: #ff4500; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Bharat-Realism Image Eval</h2>
    <p>Prompt: "A realistic smartphone photo of a 25-year-old Indian man wearing an olive green kurta on a Mumbai balcony at late evening..."</p>
  </div>
  
  <div class="image-grid">
    <!-- Model A -->
    <div class="image-card">
      <div class="image-placeholder">Image A (e.g. OpenAI)</div>
      <div class="rating-group">
        <label>Cultural Authenticity</label>
        <div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
      </div>
      <div class="rating-group">
        <label>Realism / Candidness</label>
        <div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
      </div>
    </div>
    
    <!-- Model B -->
    <div class="image-card">
      <div class="image-placeholder">Image B (e.g. Gemini 2.5)</div>
      <div class="rating-group">
        <label>Cultural Authenticity</label>
        <div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
      </div>
      <div class="rating-group">
        <label>Realism / Candidness</label>
        <div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
      </div>
    </div>

    <!-- Model C -->
    <div class="image-card">
      <div class="image-placeholder">Image C (e.g. Gemini 3.1)</div>
      <div class="rating-group">
        <label>Cultural Authenticity</label>
        <div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
      </div>
      <div class="rating-group">
        <label>Realism / Candidness</label>
        <div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
      </div>
    </div>
  </div>
  
  <button class="btn">Submit Ratings</button>
</div>
</body>
</html>
