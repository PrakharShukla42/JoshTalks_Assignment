<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat-Realism Text-to-Image Eval</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(34, 197, 94, 0.4)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)'
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .image-zoom:hover img {
            transform: scale(1.05);
        }
        img {
            transition: transform 0.5s ease;
        }
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [view, setView] = useState('rate'); // 'rate' or 'leaderboard'
            const [submitted, setSubmitted] = useState(false);

            // Realistic Mock Images
            const models = [
                { 
                    id: 'm1', 
                    name: 'Model A (OpenAI)', 
                    color: 'from-blue-400 to-blue-600',
                    img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop',
                    tag: 'Hyper-Stylized'
                },
                { 
                    id: 'm2', 
                    name: 'Model B (Gemini 2.5)', 
                    color: 'from-purple-400 to-purple-600',
                    img: 'https://images.unsplash.com/photo-1534308143481-c55f00be8bd7?q=80&w=800&auto=format&fit=crop',
                    tag: 'Balanced'
                },
                { 
                    id: 'm3', 
                    name: 'Model C (Gemini 3.1)', 
                    color: 'from-emerald-400 to-emerald-600',
                    img: 'https://images.unsplash.com/photo-1621592484082-2d05b1290d7a?q=80&w=800&auto=format&fit=crop',
                    tag: 'Hyper-Realistic'
                }
            ];

            const [ratings, setRatings] = useState({
                m1: { cultural: 0, realism: 0, adherence: 0 },
                m2: { cultural: 0, realism: 0, adherence: 0 },
                m3: { cultural: 0, realism: 0, adherence: 0 },
            });
            const [topPick, setTopPick] = useState(null);

            const handleRate = (model, category, value) => {
                setRatings(prev => ({
                    ...prev,
                    [model]: { ...prev[model], [category]: value }
                }));
            };

            const StarRating = ({ value, onChange }) => {
                return (
                    <div className="flex space-x-1 mt-1">
                        {[1, 2, 3, 4, 5].map(star => (
                            <button 
                                key={star} 
                                onClick={() => onChange(star)}
                                className={`text-2xl transition-all duration-200 hover:scale-110 ${star <= value ? 'text-yellow-400 drop-shadow-sm' : 'text-gray-300 hover:text-yellow-200'}`}
                            >
                                ★
                            </button>
                        ))}
                    </div>
                );
            };

            const RatingView = () => (
                <div className="max-w-7xl mx-auto p-6 fade-in">
                    <header className="mb-10 text-center">
                        <div className="inline-block px-4 py-1 rounded-full bg-brand-100 text-brand-900 font-semibold text-sm mb-4 tracking-wider shadow-sm">
                            NEW EVALUATION
                        </div>
                        <h1 className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-gray-600 mb-6 drop-shadow-sm">
                            Bharat-Realism Image Eval
                        </h1>
                        <div className="glass-panel p-6 rounded-2xl shadow-glass max-w-4xl mx-auto text-left relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-brand-500 to-blue-500"></div>
                            <p className="text-gray-500 text-xs font-bold uppercase tracking-widest mb-3 ml-2">Target Prompt</p>
                            <p className="text-xl text-gray-800 leading-relaxed font-medium ml-2">
                                "A realistic smartphone photo of a 25-year-old Indian man wearing a simple cotton olive green plain Kurta. He is standing casually on the balcony of a middle-class apartment in Mumbai during late evening. The lighting is natural, slightly dim, with warm yellow light coming from inside the house."
                            </p>
                        </div>
                    </header>

                    {!submitted ? (
                        <div className="space-y-10">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {models.map((model, idx) => (
                                    <div key={model.id} className="bg-white rounded-3xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl border border-gray-100 flex flex-col group relative" style={{animationDelay: `${idx * 0.1}s`}}>
                                        {/* Image Section */}
                                        <div className="h-72 w-full bg-gray-100 relative overflow-hidden image-zoom">
                                            <div className={`absolute top-4 left-4 z-10 px-3 py-1 rounded-full text-xs font-bold text-white bg-gradient-to-r ${model.color} shadow-lg opacity-90`}>
                                                {model.name}
                                            </div>
                                            <img src={model.img} alt={model.name} className="w-full h-full object-cover" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                                                <span className="text-white font-medium text-sm drop-shadow-md">Style: {model.tag}</span>
                                            </div>
                                        </div>
                                        
                                        {/* Rating Section */}
                                        <div className="p-8 flex-1 flex flex-col">
                                            <div className="space-y-6 flex-1">
                                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 transition-colors hover:bg-white hover:border-gray-300 hover:shadow-sm">
                                                    <label className="block text-sm font-bold text-gray-800 mb-1">Cultural Authenticity</label>
                                                    <p className="text-xs text-gray-500 mb-1 font-medium">Are clothes/setting authentically Indian?</p>
                                                    <StarRating value={ratings[model.id].cultural} onChange={(val) => handleRate(model.id, 'cultural', val)} />
                                                </div>
                                                
                                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 transition-colors hover:bg-white hover:border-gray-300 hover:shadow-sm">
                                                    <label className="block text-sm font-bold text-gray-800 mb-1">Realism / Candidness</label>
                                                    <p className="text-xs text-gray-500 mb-1 font-medium">Does it look like a real smartphone photo?</p>
                                                    <StarRating value={ratings[model.id].realism} onChange={(val) => handleRate(model.id, 'realism', val)} />
                                                </div>

                                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 transition-colors hover:bg-white hover:border-gray-300 hover:shadow-sm">
                                                    <label className="block text-sm font-bold text-gray-800 mb-1">Prompt Adherence</label>
                                                    <p className="text-xs text-gray-500 mb-1 font-medium">Did it follow specific details?</p>
                                                    <StarRating value={ratings[model.id].adherence} onChange={(val) => handleRate(model.id, 'adherence', val)} />
                                                </div>
                                            </div>

                                            <div className="pt-6 mt-6 border-t border-gray-100">
                                                <button 
                                                    onClick={() => setTopPick(model.id)}
                                                    className={`w-full py-3 px-4 rounded-xl font-bold transition-all duration-200 transform hover:-translate-y-1 ${topPick === model.id ? 'bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-lg' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-900'}`}
                                                >
                                                    {topPick === model.id ? '★ Top Pick Selected' : 'Select as Top Pick'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="flex justify-center mt-12 pb-12">
                                <button 
                                    onClick={() => {
                                        if(!topPick) alert('Please select a Top Pick before submitting!');
                                        else setSubmitted(true);
                                    }}
                                    className="relative inline-flex items-center justify-center px-10 py-4 font-bold text-white transition-all duration-200 bg-gray-900 font-pj rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 hover:bg-gray-800 hover:shadow-xl hover:-translate-y-1 text-lg shadow-2xl"
                                >
                                    Submit Human Evaluation &rarr;
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-20 fade-in glass-panel rounded-3xl shadow-2xl max-w-2xl mx-auto">
                            <div className="inline-flex items-center justify-center w-28 h-28 bg-gradient-to-br from-green-400 to-brand-600 rounded-full mb-8 shadow-glow animate-bounce">
                                <svg className="w-14 h-14 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 className="text-4xl font-extrabold text-gray-900 mb-4">Ratings Submitted!</h2>
                            <p className="text-xl text-gray-600 mb-10">Your human-feedback data has been saved.</p>
                            <button 
                                onClick={() => setView('leaderboard')}
                                className="bg-gray-900 hover:bg-black text-white font-bold py-4 px-10 rounded-full shadow-xl transition-transform hover:scale-105"
                            >
                                View Global Leaderboard
                            </button>
                        </div>
                    )}
                </div>
            );

            const LeaderboardView = () => (
                <div className="max-w-6xl mx-auto p-6 fade-in">
                    <div className="flex justify-between items-center mb-10 mt-4">
                        <div>
                            <h2 className="text-4xl font-extrabold text-gray-900">Live Leaderboard</h2>
                            <p className="text-gray-500 mt-2 font-medium">Aggregated Human Feedback (N=1,240 Ratings)</p>
                        </div>
                        <button onClick={() => { setView('rate'); setSubmitted(false); }} className="text-indigo-600 hover:text-indigo-800 font-bold bg-indigo-50 px-5 py-2 rounded-full transition-colors hover:bg-indigo-100 flex items-center">
                            &larr; Back to Rating
                        </button>
                    </div>

                    <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-8 py-5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Rank</th>
                                    <th className="px-8 py-5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Model Name</th>
                                    <th className="px-8 py-5 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Total Score</th>
                                    <th className="px-8 py-5 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Authenticity</th>
                                    <th className="px-8 py-5 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Realism</th>
                                    <th className="px-8 py-5 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Adherence</th>
                                    <th className="px-8 py-5 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Win Rate</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-100">
                                <tr className="bg-gradient-to-r from-green-50 to-emerald-50/20 hover:bg-green-100/50 transition-colors">
                                    <td className="px-8 py-8 whitespace-nowrap text-2xl font-black text-green-600">🥇 1</td>
                                    <td className="px-8 py-8 whitespace-nowrap">
                                        <div className="text-lg font-bold text-gray-900">Gemini 3.1 Flash</div>
                                        <div className="text-xs text-green-600 font-semibold mt-1">Leading in Realism</div>
                                    </td>
                                    <td className="px-8 py-8 whitespace-nowrap text-lg text-center font-black text-green-600">4.46</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-semibold text-gray-700">4.6</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-black text-green-600 bg-white/50 rounded-lg">4.5</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-semibold text-gray-700">4.3</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-black text-gray-900">70.2%</td>
                                </tr>
                                <tr className="hover:bg-gray-50 transition-colors">
                                    <td className="px-8 py-8 whitespace-nowrap text-xl font-bold text-gray-500">🥈 2</td>
                                    <td className="px-8 py-8 whitespace-nowrap">
                                        <div className="text-lg font-bold text-gray-800">Gemini 2.5 Flash</div>
                                        <div className="text-xs text-gray-500 mt-1">Solid Baseline</div>
                                    </td>
                                    <td className="px-8 py-8 whitespace-nowrap text-lg text-center font-bold text-blue-600">3.83</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-semibold text-gray-700">4.1</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-medium text-gray-500">3.4</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-semibold text-gray-700">4.0</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-bold text-gray-700">29.8%</td>
                                </tr>
                                <tr className="hover:bg-gray-50 transition-colors">
                                    <td className="px-8 py-8 whitespace-nowrap text-xl font-bold text-gray-400">🥉 3</td>
                                    <td className="px-8 py-8 whitespace-nowrap">
                                        <div className="text-lg font-bold text-gray-800">OpenAI DALL-E 3</div>
                                        <div className="text-xs text-red-500 font-semibold mt-1">Struggles with Realism</div>
                                    </td>
                                    <td className="px-8 py-8 whitespace-nowrap text-lg text-center font-bold text-gray-600">3.36</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-medium text-gray-500">3.2</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-bold text-red-500 bg-red-50 rounded-lg">2.1</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-black text-indigo-600">4.8</td>
                                    <td className="px-8 py-8 whitespace-nowrap text-md text-center font-bold text-gray-400">0.0%</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen text-gray-900 pb-12">
                    <nav className="glass-panel sticky top-0 z-50 border-b border-gray-200/50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 lg:px-8">
                            <div className="flex justify-between h-20 items-center">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('rate')}>
                                    <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-blue-500 rounded-xl shadow-lg flex items-center justify-center">
                                        <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    </div>
                                    <div>
                                        <span className="text-xl font-black tracking-tight text-gray-900 block leading-none">Josh Talks AI</span>
                                        <span className="text-xs font-bold text-gray-500 uppercase tracking-widest mt-1 block">Eval Studio</span>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-2 bg-gray-100 p-1 rounded-full">
                                    <button 
                                        onClick={() => setView('rate')} 
                                        className={`px-5 py-2 rounded-full text-sm font-bold transition-all ${view === 'rate' ? 'bg-white text-gray-900 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Human Feedback
                                    </button>
                                    <button 
                                        onClick={() => setView('leaderboard')} 
                                        className={`px-5 py-2 rounded-full text-sm font-bold transition-all ${view === 'leaderboard' ? 'bg-white text-gray-900 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Global Leaderboard
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="pt-8">
                        {view === 'rate' ? <RatingView /> : <LeaderboardView />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
